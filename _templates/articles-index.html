<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Articles | [NAME]</title>

    <meta
        name="description"
        content="Technical articles, notes, experiments, and lessons."
    >

    <meta
        name="author"
        content="[NAME]"
    >

    <link
        rel="canonical"
        href="https://[PAGE_URL]/articles/"
    >

    <meta
        property="og:title"
        content="Articles | [NAME]"
    >

    <meta
        property="og:description"
        content="Technical articles, notes, experiments, and lessons."
    >

    <meta
        property="og:type"
        content="website"
    >

    <meta
        property="og:url"
        content="https://[PAGE_URL]/articles/"
    >

    <link
        rel="stylesheet"
        href="/style.css"
    >

    <link
        rel="apple-touch-icon"
        sizes="180x180"
        href="/images/home/logo.png"
    >

    <link
        rel="icon"
        type="image/png"
        sizes="192x192"
        href="/images/home/logo.png"
    >
</head>

<body>

    <header class="site-header">

        <nav
            class="site-nav"
            aria-label="Main navigation"
        >
            <a href="/">Home</a>
            <a href="/articles/">Articles</a>
            <a href="/#projects">Projects</a>
            <a href="/#contact">Contact</a>
        </nav>

        <div class="header-image-container"></div>

    </header>


    <main>

        <header class="page-header">

            <h1>
                Articles
            </h1>

        </header>


        <section aria-labelledby="articles-heading">

            <h2
                id="articles-heading"
                class="visually-hidden"
            >
                Articles
            </h2>

            <ul class="article-list">

                <li class="article-list-item">
                    <article>

                        <header>

                            <h2>
                                <a href="/articles/example-article/">
                                    Example Article Title
                                </a>
                            </h2>

                            <p class="article-meta">

                                <time datetime="2026-01-01">
                                    1 January 2026
                                </time>

                                · 5 min read

                            </p>

                        </header>

                    </article>
                </li>


                <li class="article-list-item">
                    <article>

                        <header>

                            <h2>
                                <a href="/articles/example-article-2/">
                                    Another Example Article
                                </a>
                            </h2>

                            <p class="article-meta">

                                <time datetime="2025-12-01">
                                    1 December 2025
                                </time>

                                · 4 min read

                            </p>

                        </header>

                    </article>
                </li>

            </ul>

        </section>

    </main>


    <footer class="site-footer">

        <div class="footer-image-container"></div>

        <div class="footer-content">

            <p class="footer-site-name">
                [PAGE_URL]
            </p>

            <nav
                class="footer-nav"
                aria-label="Footer navigation"
            >
                <a href="/">Home</a>
                <a href="/articles/">Articles</a>
                <a href="/#projects">Projects</a>
            </nav>

            <p class="footer-links">

                <a
                    href="https://github.com/[USER]"
                    target="_blank"
                    rel="noopener noreferrer"
                >
                    GitHub
                </a>

                |

                <a
                    href="https://www.linkedin.com/in/[LINKEDIN_URL]"
                    target="_blank"
                    rel="noopener noreferrer"
                >
                    LinkedIn
                </a>

                |

                <a
                    href="https://medium.com/@[USER]"
                    target="_blank"
                    rel="noopener noreferrer"
                >
                    Medium
                </a>

            </p>

            <p class="footer-copyright">
                © [YEAR] [NAME]
            </p>

        </div>

    </footer>

</body>
</html>
