<!DOCTYPE html>

<html lang="en">
<head>
    <meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>Article Title | <ME></title>

<meta
    name="description"
    content="Short description of the article."
>

<meta
    name="author"
    content="<ME>"
>

<link
    rel="canonical"
    href="https://<page_url>/articles/<article-slug>/"
>

<meta
    property="og:title"
    content="Article Title"
>

<meta
    property="og:description"
    content="Short description of the article."
>

<meta
    property="og:type"
    content="article"
>

<meta
    property="og:url"
    content="https://<page_url>/articles/<article-slug>/"
>

<meta
    property="og:image"
    content="https://<page_url>/images/articles/<article-slug>/img-<article-slug>-001.webp"
>

<meta
    property="article:published_time"
    content="YYYY-MM-DD"
>

<meta
    property="article:author"
    content="<ME>"
>

<meta
    name="twitter:card"
    content="summary_large_image"
>

<link
    rel="apple-touch-icon"
    sizes="180x180"
    href="/images/home/logo.png"
>

<link
    rel="icon"
    type="image/png"
    sizes="192x192"
    href="/images/home/logo.png"
>

<link
    rel="stylesheet"
    href="/style.css"
>

</head>

<body>

<header class="site-header">

    <nav class="site-nav" aria-label="Main navigation">

        <a href="/">Home</a>

        <a href="/articles/">Articles</a>

        <a href="/#projects">Projects</a>

        <a href="/#contact">Contact</a>

    </nav>

    <div class="header-image-container"></div>

</header>


<main>

    <article>

        <header class="article-header">

            <p class="article-date">
                <time datetime="YYYY-MM-DD">
                    DD Month YYYY
                </time>
            </p>

            <h1>
                Article Title
            </h1>

        </header>


        <!-- Optional article cover -->

        <figure class="article-cover">

            <img
                src="/images/articles/<article-slug>/img-<article-slug>-001.webp"
                alt="Describe the cover image"
            >

        </figure>


        <div class="article-content">

            <p>
                Your article starts here.
            </p>


            <!--
                Article content is intentionally flexible.

                You can use any of the following in any order:

                <p>Paragraph</p>

                <h2>Section heading</h2>

                <h3>Subsection heading</h3>

                <figure class="article-image">
                    <img
                        src="/images/articles/<article-slug>/img-<article-slug>-002.webp"
                        alt="Describe the image"
                    >
                    <figcaption>
                        Optional caption.
                    </figcaption>
                </figure>

                <ul>
                    <li>List item</li>
                </ul>

                <ol>
                    <li>List item</li>
                </ol>

                <p>
                    Inline <code>code</code> is supported.
                </p>

                <pre><code>your-command-here</code></pre>

                <blockquote>
                    <p>Quoted text goes here.</p>
                </blockquote>

                <aside class="article-note">
                    <p>
                        Additional note related to the article.
                    </p>
                </aside>

                <p>
                    <a href="/articles/example/">
                        Internal article link
                    </a>
                </p>
            -->


        </div>


        <footer class="article-footer">

            <p>

                <a href="/articles/">
                    ← Back to articles
                </a>

                <!--
                Optional previous / next article navigation:

                &nbsp; | &nbsp;

                <a href="/articles/<previous-slug>/">
                    ← Previous article
                </a>

                &nbsp; | &nbsp;

                <a href="/articles/<next-slug>/">
                    Next article →
                </a>
                -->

            </p>

        </footer>

    </article>

</main>


<footer class="site-footer">

    <div class="footer-image-container"></div>

    <div class="footer-content">

        <p class="footer-site-name">
            <page_url>
        </p>

        <nav
            class="footer-nav"
            aria-label="Footer navigation"
        >

            <a href="/">
                Home
            </a>

            <a href="/articles/">
                Articles
            </a>

            <a href="/#projects">
                Projects
            </a>

        </nav>

        <p class="footer-links">

            <a
                href="https://github.com/<USER>"
                target="_blank"
                rel="noopener noreferrer"
            >
                GitHub
            </a>

            |

            <a
                href="https://www.linkedin.com/in/<linkedin_url>"
                target="_blank"
                rel="noopener noreferrer"
            >
                LinkedIn
            </a>

            |

            <a
                href="https://medium.com/@<USER>"
                target="_blank"
                rel="noopener noreferrer"
            >
                Medium
            </a>

        </p>

        <p class="footer-copyright">
            © 2026 <ME>
        </p>

    </div>

</footer>

</body>
</html>
